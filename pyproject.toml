[project]
name = "gitlab-security-review-agent"
version = "0.1.0"
description = "Code review agent"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.72",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
]

[tool.uv]
package = true

[project.scripts]
review-agent = "app.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gitlab_security_review_agent"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
