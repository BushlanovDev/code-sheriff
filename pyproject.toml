[project]
name = "code-sheriff"
version = "0.1.5"
description = "Code Sheriff: Security Review Agent"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.80",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
]

[tool.uv]
package = true

[project.scripts]
code-sheriff = "app.main:cli_main"
code-sheriff-eval = "app.evals.run_eval:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["code_sheriff"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
